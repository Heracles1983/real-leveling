name: Build Pages and test CloudBase API
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-pages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Publish rebuilt Pages bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "build: refresh GitHub Pages bundle"
          git push
  health:
    needs: build-pages
    if: always() && (needs.build-pages.result == 'success' || needs.build-pages.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check public health endpoint
        run: curl --fail-with-body --silent --show-error --max-time 45 https://real-leveling-d2g7pu9shcf32cce6-1452079345.ap-shanghai.app.tcloudbase.com/real-leveling-api/health
      - name: Request proxied anonymous session
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --max-time 45 \
            https://real-leveling-d2g7pu9shcf32cce6-1452079345.ap-shanghai.app.tcloudbase.com/real-leveling-api/api/session \
            -H 'Origin: https://heracles1983.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"deviceId":"real-leveling-smoke-test"}' \
            -o "$RUNNER_TEMP/tcb-auth.json"
      - name: Validate anonymous access token
        run: jq -er '.access_token' "$RUNNER_TEMP/tcb-auth.json" > "$RUNNER_TEMP/tcb-token"
      - name: Read demo game save
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/tcb-token")"
          curl --fail-with-body --silent --show-error --max-time 45 \
            'https://real-leveling-d2g7pu9shcf32cce6-1452079345.ap-shanghai.app.tcloudbase.com/real-leveling-api/api/game?mode=demo' \
            -H 'Origin: https://heracles1983.github.io' \
            -H "Authorization: Bearer $TOKEN" | jq -e '.state and (.revision >= 0)' >/dev/null

      - name: Check browser CORS responses
        run: |
          node --input-type=module <<'NODE'
          const origin='https://heracles1983.github.io';
          const base='https://real-leveling-d2g7pu9shcf32cce6-1452079345.ap-shanghai.app.tcloudbase.com/real-leveling-api';
          for(const [name,url,method,headers] of [
            ['session',base+'/api/session','POST','content-type'],
            ['game',base+'/api/game?mode=demo','GET','authorization']
          ]){
            const r=await fetch(url,{method:'OPTIONS',headers:{Origin:origin,'Access-Control-Request-Method':method,'Access-Control-Request-Headers':headers},signal:AbortSignal.timeout(30000)});
            if(r.status!==204||r.headers.get('access-control-allow-origin')!==origin)throw new Error(`${name} CORS failed: ${r.status}`);
          }
          NODE
