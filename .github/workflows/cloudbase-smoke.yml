name: CloudBase API smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check public health endpoint
        run: curl --fail-with-body --silent --show-error --max-time 45 https://real-leveling-d2g7pu9shcf32cce6-1452079345.ap-shanghai.app.tcloudbase.com/real-leveling-api/health
      - name: Request anonymous CloudBase session
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --max-time 45 https://real-leveling-d2g7pu9shcf32cce6.api.tcloudbasegateway.com/auth/v1/signin/anonymously -H 'Content-Type: application/json' -H 'Accept: application/json' -H 'x-device-id: real-leveling-smoke-test' --data '{}' -o "$RUNNER_TEMP/tcb-auth.json"
      - name: Validate anonymous access token
        run: jq -er '.access_token' "$RUNNER_TEMP/tcb-auth.json" > "$RUNNER_TEMP/tcb-token"
      - name: Read demo game save
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/tcb-token")"
          curl --fail-with-body --silent --show-error --max-time 45 'https://real-leveling-d2g7pu9shcf32cce6-1452079345.ap-shanghai.app.tcloudbase.com/real-leveling-api/api/game?mode=demo' -H "Authorization: Bearer $TOKEN" | jq -e '.state and (.revision >= 0)' >/dev/null
