ght:165px;object-fit:contain}.level{position:absolute;right:12px;bottom:11px;background:#143e31;color:#fff;border:3px solid #f3c65f;border-radius:50%;width:50px;height:50px;display:grid;place-items:center;font-weight:900;font-size:12px}.pad{padding:15px}.name{text-align:center;margin:0 0 14px}.name h2{margin:0;font:700 22px Georgia,"Songti SC"}.name small{color:#789080}.meter{margin:10px 0}.meter-label{display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-bottom:5px}.bar{height:8px;border-radius:999px;background:#d7d1bb;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e8a82f,#ffd96d);border-radius:inherit}.stat{display:grid;grid-template-columns:1fr 30px 28px;gap:7px;align-items:center;padding:9px 0;border-bottom:1px dashed #d5ceb8;font-size:13px}.stat b{text-align:center}.plus,.small,.action,.route,.tab,.file{cursor:pointer;border:1px solid #b8b29d;border-radius:7px;background:#fff8df;font-weight:800}.plus{height:27px;background:#d8ead8;color:#246546}.plus:disabled,.action:disabled,.route:disabled,.small:disabled{opacity:.38;cursor:not-allowed}.points{color:#9a6812;font-size:11px}.combat-stats,.wallet{display:flex;justify-content:space-between;background:#e8e3ce;border-radius:8px;padding:9px;margin-top:12px;font-size:11px}.wallet{background:#153a2e;color:#fff}.battle{min-height:480px}.tabs{display:flex;gap:6px;padding:10px;background:#eee9d7;border-bottom:1px solid var(--line)}.tab{padding:8px 15px;background:#f7f3e3}.tab.active{background:#194838;color:#fff}.scene{height:360px;position:relative;overflow:hidden;background:#183b2d}.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#00000010,#071a1460)}.hud{position:absolute;z-index:2;top:15px;width:210px;padding:9px;background:#fffdf0e8;border:2px solid #193d31;border-radius:7px;font-size:11px}.hero-hud{left:14px}.enemy-hud{right:14px}.fighter{position:absolute;z-index:3;bottom:22px;filter:drop-shadow(0 8px 4px #0005)}.fighter canvas{width:100%;height:100%;object-fit:contain}.hero{left:9%;width:180px;height:190px}.enemy{right:8%;width:190px;height:190px}.enemy.golem{width:250px;height:235px;right:4%;bottom:5px}.prompt{position:absolute;z-index:4;left:50%;top:52%;transform:translate(-50%,-50%);background:#112b23e8;color:white;padding:12px 18px;border:1px solid #f0c85a;border-radius:8px;text-align:center}.prompt strong{display:block;font:700 23px Georgia,"Songti SC"}.controls{padding:14px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.action{padding:11px 6px;background:#f6f0d8}.action.primary{background:#174938;color:white;border-color:#174938}.departure{display:flex;align-items:center;justify-content:space-between;gap:12px}.departure p{margin:0;font-size:13px}.gold{background:linear-gradient(#ffd26a,#e9ad32);border-color:#b97b12;padding:11px 18px}.routes{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:0 14px 14px}.route{padding:8px 3px;font-size:10px}.route.active{outline:3px solid #edb83d}.route.done{background:#d5e9d5}.route span{display:block;margin-top:3px}.notice{margin:12px 14px 14px;padding:10px 12px;border-left:4px solid var(--gold);background:#fff8db;font-size:12px;min-height:39px}.activity-intro{text-align:center;padding:14px 12px 5px}.activity-intro h2{font:700 20px Georgia,"Songti SC";margin:5px}.activity-intro p{font-size:12px;color:#6d7e71}.record{padding:11px 13px;border-top:1px solid #ded7c0;display:grid;grid-template-columns:1fr auto;gap:8px;font-size:12px}.record strong{display:block}.record small{color:#75867a}.reward{text-align:right;color:#a16b10;font-weight:900}.small{padding:5px 8px;margin-top:4px;font-size:11px;background:#dcebd9}.tools{padding:12px;border-top:1px solid var(--line);display:grid;gap:8px}.file{padding:10px;background:#173f32;color:white;text-align:center}.file input{display:none}.reset{background:transparent;color:#9f453c}.forge{display:none;padding:24px}.forge.show{display:block}.forge-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gear{padding:22px;background:#f0ead2;border:1px solid var(--line);border-radius:10px;text-align:center}.gear .icon{font-size:42px}.gear h3{margin:7px}.footer{text-align:center;color:#62766a;font-size:11px;margin-top:18px}.shake{animation:shake .22s}.hit{animation:hit .25s}.win{animation:win .8s}@keyframes shake{50%{transform:translateX(-12px)}}@keyframes hit{50%{transform:translateX(18px);filter:brightness(1.8)}}@keyframes win{50%{transform:translateY(-18px)}}@media(max-width:1050px){.layout{grid-template-columns:230px 1fr}.activity{grid-column:1/-1}.activity .records{display:grid;grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.topbar{height:58px}.save{display:none}.shell{padding:18px 10px}.heading{align-items:start}.heading h1{font-size:31px}.heading h1 span{display:block;margin:4px 0}.layout{display:flex;flex-direction:column}.character{order:2}.battle{order:1}.activity{order:3}.portrait{height:145px}.portrait canvas{height:130px}.scene{height:310px}.hero{left:1%;width:130px;height:150px}.enemy{right:0;width:145px;height:150px}.enemy.golem{width:185px;height:180px}.hud{width:155px}.actions{grid-template-columns:1fr 1fr}.routes{grid-template-columns:repeat(3,1fr)}.activity .records{display:block}.forge-grid{grid-template-columns:1fr}.badge{font-size:10px}}

<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">⚔️</span><div><strong>现实练级</strong><small>REAL LEVELING</small></div></div><span class="save">💾 本机自动存档</span></header>
  <main class="shell">
    <div class="heading"><div><div class="eyebrow">CHAPTER 01 ／ FOREST EXPEDITION</div><h1>林间远征<span>现实的每一步，都算数。</span></h1></div><span class="badge">GitHub Pages · 纯前端版</span></div>
    <div class="layout">
      <aside class="panel character"><div class="panel-title"><span>你的冒险者</span><span class="points" id="points"></span></div><div class="portrait"><canvas data-sprite="hero"></canvas><span class="level" id="level"></span></div><div class="pad"><div class="name"><h2 id="title">初行者</h2><small>自由成长 · 冒险者</small></div><div id="xp"></div><div id="stats"></div><div class="combat-stats" id="combatStats"></div><div class="wallet" id="wallet"></div></div></aside>
      <section class="panel battle"><div class="tabs"><button class="tab active" data-tab="battle">⚔ 远征</button><button class="tab" data-tab="forge">◆ 装备工坊</button></div><div id="battleTab"><div class="scene"><img class="scene-bg" src="./art/forest-battle.png" alt="林间远征场景"><div class="hud hero-hud" id="heroHud"></div><div class="hud enemy-hud" id="enemyHud"></div><div class="fighter hero" id="heroF"><canvas data-sprite="hero"></canvas></div><div class="fighter enemy" id="enemyF"><canvas id="enemyCanvas"></canvas></div><div class="prompt" id="prompt"></div></div><div class="controls" id="controls"></div><div class="routes" id="routes"></div><div class="notice" id="notice" aria-live="polite"></div></div><div class="forge" id="forgeTab"><div class="eyebrow">EQUIPMENT WORKSHOP</div><h2>把每次积累，锻造成力量。</h2><div class="forge-grid" id="forgeGrid"></div></div></section>
      <aside class="panel activity"><div class="panel-title"><span>运动补给站</span><span class="points">本地数据</span></div><div class="activity-intro"><div style="font-size:32px">⚡</div><h2>让运动，成为经验。</h2><p>领取演示记录，或导入自己的 CSV / JSON。</p><div id="daily"></div></div><div class="records" id="records"></div><div class="tools"><label class="file">＋ 导入运动记录<input id="file" type="file" accept=".csv,.json"></label><button class="file reset" id="reset">重置本机进度</button></div></aside>
    </div><div class="footer">数据只保存在当前浏览器。Intervals.icu 在线同步与私人云存档请使用仓库 README 中的 Site 版本。</div>
  </main>
<script>
const BOX={hero:[102,85,332,339],slime:[651,209,224,192],mushroom:[1157,159,216,249],bat:[48,605,438,271],archer:[577,570,349,364],golem:[1036,512,460,434]};
const ENEMIES=[['露珠史莱姆','苔石入口','slime',64,10,0,15,1],['赤帽菇精','蘑菇小径','mushroom',88,14,2,20,1],['暮光蝠','暮色林地','bat',100,17,1,25,1],['苔衣游侠','失落哨站','archer',130,20,5,30,2],['琥珀史莱姆','晶石溪谷','slime',158,22,7,40,2],['古树石像守卫','遗迹之心','golem',225,26,6,80,3]];
const KEY='real-leveling-pages-v1';let selected=0;
function fresh(){let d=new Date().toISOString();return{level:1,xp:20,points:2,stats:{strength:4,endurance:4,agility:4},gold:20,materials:2,weapon:0,armor:0,potions:2,cleared:[],battle:null,records:[['demo:ride','林间晨骑','骑行',45],['demo:strength','完成一堂力量课','力量训练',40],['demo:walk','傍晚散步','步行',25]].map(x=>({id:x[0],name:x[1],type:x[2],minutes:x[3],start:d,claimed:false,xp:0,material:0})),notice:'领取一条运动记录，开启第一次成长。'}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{S=fresh()}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function power(){return{hp:70+S.stats.endurance*8+S.armor*9,attack:9+S.stats.strength*2+S.weapon*4,defense:1+S.armor*3,crit:Math.min(40,4+S.stats.agility*2),energy:10+Math.floor(S.stats.endurance/3)}}function need(){return 100+(S.level-1)*30}function meter(label,value,max,color='#edb740'){return`<div class="meter"><div class="meter-label"><span>${label}</span><span>${value} / ${max}</span></div><div class="bar"><i style="width:${Math.min(100,value/max*100)}%;background:${color}"></i></div></div>`}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let atlas=new Image();atlas.src='./art/character-atlas.png';atlas.onload=drawSprites;function draw(canvas,name){let b=BOX[name]||BOX.hero,ctx=canvas.getContext('2d');canvas.width=b[2];canvas.height=b[3];ctx.imageSmoothingEnabled=false;ctx.drawImage(atlas,...b,0,0,b[2],b[3]);let p=ctx.getImageData(0,0,b[2],b[3]);for(let i=0;i<p.data.length;i+=4)if(p.data[i]>180&&p.data[i+2]>180&&p.data[i+1]<90)p.data[i+3]=0;ctx.putImageData(p,0,0)}function drawSprites(){document.querySelectorAll('[data-sprite="hero"]').forEach(c=>draw(c,'hero'));draw(document.querySelector('#enemyCanvas'),ENEMIES[S.battle?.enemy??selected][2])}
function addXp(n){S.xp+=n;while(S.xp>=need()){S.xp-=need();S.level++;S.points+=2}}
function claim(id){if(S.battle)return alert('请先结束战斗。');let r=S.records.find(x=>x.id===id);if(!r||r.claimed)return;let day=S.records.filter(x=>x.claimed&&x.start.slice(0,10)===r.start.slice(0,10)),used=day.reduce((n,x)=>n+x.xp,0);r.xp=Math.max(0,Math.min(80,Math.floor(r.minutes*2),150-used));r.material=day.reduce((n,x)=>n+x.material,0)<2?1:0;r.claimed=true;addXp(r.xp);S.materials+=r.material;S.notice=`领取 ${r.xp} 经验、${r.material} 枚符石。`;save();render()}
function stat(k){if(!S.points||S.battle)return;S.stats[k]++;S.points--;S.notice='属性已提升。';save();render()}
function start(){let e=ENEMIES[selected];if(selected&& !S.cleared.includes(selected-1))return;let p=power();S.battle={enemy:selected,hp:p.hp,enemyHp:e[3],energy:p.energy,turn:1};S.notice=`遭遇${e[0]}。`;save();render()}
function move(m){let b=S.battle;if(!b)return;let e=ENEMIES[b.enemy],p=power();if(m==='heavy'&&b.energy<4)return alert('能量不足');if(m==='potion'&&(!S.potions||b.hp===p.hp))return alert('暂时不能使用药水');let line='';if(m==='attack'||m==='heavy'){let crit=Math.random()*100<p.crit,d=Math.max(1,Math.round((p.attack*(m==='heavy'?1.65:1)-e[5]*(m==='heavy'?.3:1))*(crit?1.5:1)));b.enemyHp=Math.max(0,b.enemyHp-d);b.energy=Math.min(p.energy,b.energy+(m==='heavy'?-4:2));line=`${crit?'暴击！':''}造成 ${d} 点伤害。`;document.querySelector('#enemyF').classList.add('hit')}else if(m==='guard'){b.energy=Math.min(p.energy,b.energy+4);line='举盾防御，恢复4点能量。'}else{let h=Math.min(p.hp-b.hp,Math.round(p.hp*.45));b.hp+=h;S.potions--;line=`药水恢复 ${h} 点生命。`}if(b.enemyHp<=0){let first=!S.cleared.includes(b.enemy);if(first){S.cleared.push(b.enemy);S.gold+=e[6];S.materials+=e[7]}S.notice=`战斗胜利！${first?`获得 ${e[6]} 金币、${e[7]} 符石。`:''}`;S.battle=null;selected=Math.min(selected+1,5);document.querySelector('#heroF').classList.add('win')}else{let heavy=b.enemy>0&&b.turn%3===0,inc=Math.max(1,Math.round((e[4]*(heavy?1.8:1)-p.defense)*(m==='guard'?.25:1)));b.hp=Math.max(0,b.hp-inc);b.turn++;S.notice=`${line} ${e[0]}${heavy?'重击':'反击'}造成 ${inc} 点伤害。`;document.querySelector('#heroF').classList.add('shake');if(!b.hp){S.notice='暂时撤回营地，永久成长全部保留。';S.battle=null}}save();setTimeout(render,230)}
function forge(k){if(S.battle)return;let cost=20+S[k]*15;if(S[k]>=5||S.gold<cost||S.materials<2)return alert(`需要 ${cost} 金币和2枚符石`);S.gold-=cost;S.materials-=2;S[k]++;S.notice='锻造完成，下一场战斗即可生效。';save();render()}
function render(){let p=power(),b=S.battle,e=ENEMIES[b?.enemy??selected];document.querySelector('#level').textContent=`LV.${String(S.level).padStart(2,'0')}`;document.querySelector('#title').textContent=S.cleared.includes(5)?'林间守护者':'初行者';document.querySelector('#points').textContent=`${S.points} 点待分配`;document.querySelector('#xp').innerHTML=meter('升级经验',S.xp,need());document.querySelector('#stats').innerHTML=[['strength','力量'],['endurance','耐力'],['agility','敏捷']].map(x=>`<div class="stat"><span>${x[1]}</span><b>${S.stats[x[0]]}</b><button class="plus" onclick="stat('${x[0]}')" ${!S.points||b?'disabled':''}>＋</button></div>`).join('');document.querySelector('#combatStats').innerHTML=`<span>攻击 <b>${p.attack}</b></span><span>防御 <b>${p.defense}</b></span><span>暴击 <b>${p.crit}%</b></span>`;document.querySelector('#wallet').innerHTML=`<span>🪙 ${S.gold}</span><span>◆ ${S.materials}</span><span>🧪 ${S.potions}</span>`;document.querySelector('#heroHud').innerHTML=`<b>初行者 · LV.${S.level}</b>${meter('生命',b?.hp??p.hp,p.hp,'#63c78f')}${b?meter('能量',b.energy,p.energy,'#64aee8'):''}`;document.querySelector('#enemyHud').innerHTML=`<b>${e[0]}</b>${meter('生命',b?.enemyHp??e[3],e[3],'#dc6657')}`;document.querySelector('#prompt').innerHTML=b?`<small>第 ${b.turn} 回合</small><strong>${b.enemy>0&&b.turn%3===0?'敌人正在蓄力':'选择行动'}</strong>`:`<small>你的下一场冒险</small><strong>${e[0]}</strong>`;document.querySelector('#enemyF').className=`fighter enemy ${e[2]}`;if(atlas.complete)drawSprites();document.querySelector('#controls').innerHTML=b?`<div class="actions"><button class="action primary" onclick="move('attack')">⚔ 攻击<br><small>恢复2能量</small></button><button class="action" onclick="move('heavy')">⚡ 重击<br><small>消耗4能量</small></button><button class="action" onclick="move('guard')">🛡 防御<br><small>减伤并回能</small></button><button class="action" onclick="move('potion')">🧪 药水<br><small>剩余${S.potions}瓶</small></button></div>`:`<div class="departure"><p><b>准备好出发了吗？</b><br><small>普通攻击回能，敌人蓄力时记得防御。</small></p><button class="action gold" onclick="start()">开始战斗 ›</button></div>`;document.querySelector('#routes').innerHTML=ENEMIES.map((x,i)=>`<button class="route ${selected===i?'active':''} ${S.cleared.includes(i)?'done':''}" onclick="selected=${i};render()" ${i>0&&!S.cleared.includes(i-1)||b?'disabled':''}>${S.cleared.includes(i)?'✓':i===5?'♛':'⚔'}<span>${x[1]}</span></button>`).join('');document.querySelector('#notice').textContent=S.notice;let today=S.records.filter(x=>x.claimed).reduce((n,x)=>n+x.xp,0);document.querySelector('#daily').innerHTML=meter('今日已获经验',Math.min(today,150),150);document.querySelector('#records').innerHTML=S.records.slice(0,5).map(r=>`<div class="record"><div><strong>${esc(r.name)}</strong><small>${esc(r.type)} · ${r.minutes} 分钟</small></div><div class="reward">${r.claimed?'✓ 已领取':`+${Math.min(80,Math.floor(r.minutes*2))} EXP<br><button class="small" onclick="claim('${encodeURIComponent(r.id)}')">领取</button>`}</div></div>`).join('').replaceAll("claim('%","claim('%");document.querySelectorAll('[onclick^="claim"]').forEach(el=>{let raw=el.getAttribute('onclick').slice(7,-2);el.onclick=()=>claim(decodeURIComponent(raw))});document.querySelector('#forgeGrid').innerHTML=[['weapon','⚔️','旅人短剑','攻击 +4'],['armor','🛡️','林行者护甲','防御 +3 · 生命 +9']].map(g=>{let cost=20+S[g[0]]*15;return`<article class="gear"><div class="icon">${g[1]}</div><small>强化 +${S[g[0]]}</small><h3>${g[2]}</h3><p>下一级：${g[3]}</p><button class="action gold" onclick="forge('${g[0]}')">🪙${cost} ◆2 · 锻造</button></article>`}).join('')}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');let forge=t.dataset.tab==='forge';document.querySelector('#battleTab').style.display=forge?'none':'block';document.querySelector('#forgeTab').classList.toggle('show',forge)});
document.querySelector('#reset').onclick=()=>{if(confirm('确认清除当前浏览器里的全部游戏进度？')){S=fresh();selected=0;save();render()}};
document.querySelector('#file').onchange=async ev=>{let f=ev.target.files[0];if(!f)return;try{let text=await f.text(),rows=[];if(f.name.endsWith('.json')){let j=JSON.parse(text);rows=Array.isArray(j)?j:(j.activities||[])}else{let lines=text.replace(/^\ufeff/,'').trim().split(/\r?\n/),heads=lines.shift().split(',').map(x=>x.trim());rows=lines.map(line=>{let v=line.split(',');return Object.fromEntries(heads.map((h,i)=>[h,v[i]]))})}let added=0;for(let x of rows.slice(0,250)){let id=String(x.id||`file:${x.start||x.start_date_local}:${x.name}`),minutes=Number(x.minutes||0)||Number(x.moving_time||0)/60,start=x.start||x.start_date_local||new Date().toISOString();if(!minutes||S.records.some(r=>r.id===id))continue;S.records.unshift({id,name:String(x.name||'导入运动'),type:String(x.type||'运动'),minutes:Math.round(minutes*10)/10,start:new Date(start).toISOString(),claimed:false,xp:0,material:0});added++}S.notice=`已导入 ${added} 条运动记录，数据只保存在本机。`;save();render()}catch(e){alert('文件无法读取，请使用 CSV 或 JSON。')}ev.target.value=''};
render();
</script>
</body></html>
